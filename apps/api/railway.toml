# Railway configuration (when deploying from apps/api root)
# This is used if Railway root directory is set to apps/api

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.railway"
watchPatterns = [
  "src/**",
  "prisma/**",
  "package.json",
  "package-lock.json",
  "build.mjs",
  "tsconfig.json",
  "tsconfig.build.json",
  "openapi.yaml",
  "start.sh",
  "railway-predeploy.sh",
  ".dockerignore",
  "Dockerfile.railway",
  "railway.toml",
]

[deploy]
preDeployCommand = "sh ./railway-predeploy.sh"
startCommand = "sh ./start.sh"
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
